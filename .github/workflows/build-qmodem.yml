name: Build QModem for ImmortalWrt 25.12.2 MT7621

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-qmodem.yml"
      - ".github/workflows/qmodem_package_generic"
      - ".github/workflows/qmodem_package_arch"
      - ".github/workflows/openwrt_package.config"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget zstd

      - name: Validate gateway source
        run: |
          sh -n builder/luci-app-communication-gateway/root/usr/libexec/rpcd/communication_gateway
          node --check builder/luci-app-communication-gateway/htdocs/luci-static/resources/view/communication-gateway/index.js

      - name: Download matching ImmortalWrt SDK
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.immortalwrt.org/releases/25.12.2/targets/ramips/mt7621/"
          curl -fsSL "${base}sha256sums" -o sha256sums
          sdk_line="$(awk '{ f=$2; if (substr(f,1,1)=="*") f=substr(f,2); if (substr(f,1,2)=="./") f=substr(f,3); if (f ~ /^immortalwrt-sdk-25[.]12[.]2-ramips-mt7621_.*[.]tar[.]zst$/) { print $1, f; exit } }' sha256sums)"
          if [ -z "$sdk_line" ]; then
            echo "Could not find the ImmortalWrt 25.12.2 MT7621 SDK in the official checksum list." >&2
            exit 1
          fi
          sdk_hash="$(echo "$sdk_line" | awk '{print $1}')"
          sdk_file="$(echo "$sdk_line" | awk '{print $2}')"
          echo "sdk_hash=$sdk_hash" >> "$GITHUB_OUTPUT"
          echo "sdk_file=$sdk_file" >> "$GITHUB_OUTPUT"
          echo "Downloading $sdk_file"
          wget -q "${base}${sdk_file}" -O "$sdk_file"
          echo "$sdk_hash  $sdk_file" | sha256sum -c -
          mkdir sdk
          tar --zstd -xf "$sdk_file" -C sdk --strip-components=1

      - name: Add QModem feed and select packages
        id: feeds
        shell: bash
        run: |
          set -euo pipefail
          cd sdk
          if [ ! -f feeds.conf ]; then
            cp feeds.conf.default feeds.conf
          fi
          echo "src-git qmodem https://github.com/FUjr/QModem.git;main" >> feeds.conf
          echo "src-link gateway ../builder" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -a -p qmodem
          ./scripts/feeds install -a -p gateway
          cp ../builder/.github/workflows/openwrt_package.config .config
          make defconfig
          qmodem_sha="$(git -C feeds/qmodem rev-parse HEAD)"
          echo "qmodem_sha=$qmodem_sha" >> "$GITHUB_OUTPUT"

      - name: Restore SDK build cache
        uses: actions/cache@v4
        with:
          path: |
            sdk/dl
            sdk/build_dir
            sdk/staging_dir
          key: ${{ runner.os }}-immortalwrt-${{ steps.sdk.outputs.sdk_hash }}-qmodem-${{ steps.feeds.outputs.qmodem_sha }}-${{ hashFiles('builder/.github/workflows/openwrt_package.config', 'builder/.github/workflows/qmodem_package_generic', 'builder/.github/workflows/qmodem_package_arch') }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-${{ steps.sdk.outputs.sdk_hash }}-qmodem-${{ steps.feeds.outputs.qmodem_sha }}-

      - name: Compile QModem and communication gateway packages
        shell: bash
        run: |
          set -euo pipefail
          cd sdk
          # Feeds were updated and installed in the previous step; do not repeat the network work.
          menu_file="feeds/qmodem/luci/luci-app-qmodem-next/root/usr/share/luci/menu.d/luci-app-qmodem-next.json"
          test -f "$menu_file"
          sed -i 's/"title": "Modem"/"title": "通信网关"/' "$menu_file"
          generic_packages="$(cat ../builder/.github/workflows/qmodem_package_generic)"
          arch_packages="$(cat ../builder/.github/workflows/qmodem_package_arch)"
          packages="$generic_packages $arch_packages"
          make_targets=()
          for package in $packages; do
            make_targets+=("package/$package/compile")
          done
          echo "===== Building all packages together with $(nproc) parallel jobs ====="
          make "${make_targets[@]}" -j"$(nproc)" || {
            echo "Combined build failed; retrying package-by-package with verbose logs."
            for package in $packages; do
              echo "===== Diagnostic retry: $package ====="
              make "package/$package/compile" -j1 V=s
            done
          }
          echo "===== Built package files ====="
          find bin/packages -type f \( -name '*.apk' -o -name '*.ipk' \) -print
          test -n "$(find bin/packages -type f \( -name 'qmodem*.apk' -o -name 'qmodem*.ipk' \) -print -quit)"
          test -n "$(find bin/packages -type f \( -name 'baresip-mod-ctrl_tcp*.apk' -o -name 'baresip-mod-ctrl_tcp*.ipk' \) -print -quit)" || {
            echo "Matching Baresip ctrl_tcp module was not produced." >&2
            exit 1
          }
          test -n "$(find bin/packages -type f \( -name 'luci-app-communication-gateway*.apk' -o -name 'luci-app-communication-gateway*.ipk' \) -print -quit)" || {
            echo "Unified communication gateway package was not produced." >&2
            exit 1
          }

      - name: Upload installable packages
        uses: actions/upload-artifact@v4
        with:
          name: QModem-ImmortalWrt-25.12.2-MT7621-mipsel
          path: |
            sdk/bin/packages/**/*.apk
            sdk/bin/packages/**/*.ipk
          if-no-files-found: error
          retention-days: 14
